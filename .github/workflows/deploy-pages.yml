name: Deploy to GitHub Pages

# Publishes only what the static site needs. raw/ and classified/ stay in
# the repository for provenance but are not served.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "data/**"
      - "editorial/**"
      - ".github/workflows/deploy-pages.yml"
  # Commits made by the refresh and synthesis workflows use the Actions token,
  # which never triggers a push workflow, so deploy after they complete.
  workflow_run:
    workflows: ["Refresh comments", "Question synthesis test"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data before publishing
        run: python3 scripts/validate_data.py
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js data editorial _site/
          # Editorial drafts carry internal provenance and are never served.
          rm -f _site/editorial/*-draft.json
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
