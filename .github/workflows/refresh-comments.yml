name: Refresh comments

# Pulls new or changed public comments from Regulations.gov, runs the staged
# AI classification for anything not yet processed, rebuilds data/, validates
# it and commits the result. The curated editorial/ layer is never modified.

on:
  schedule:
    - cron: "17 6 * * *"   # daily at 06:17 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Limit new submissions processed per stage (0 = no limit)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: refresh-comments
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      REGULATIONS_GOV_API_KEY: ${{ secrets.REGULATIONS_GOV_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LIMIT: ${{ github.event.inputs.limit || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch comments and attachments
        run: python3 scripts/fetch_comments.py
      - name: Extract attachment text
        run: python3 scripts/parse_attachments.py
      - name: Segment submissions
        run: python3 scripts/segment_comments.py --limit "$LIMIT"
      - name: Classify positions
        run: python3 scripts/classify_positions.py --limit "$LIMIT"
      - name: Classify cross-cutting gaps
        run: python3 scripts/classify_gaps.py --limit "$LIMIT"
      - name: Generate public summaries
        run: python3 scripts/generate_summaries.py --limit "$LIMIT"
      - name: Build public data
        run: python3 scripts/build_public_data.py
      - name: Validate public data
        run: python3 scripts/validate_data.py
      - name: Run integrity tests
        run: python3 tests/test_data_integrity.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw classified data public
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh docket data ($(date -u +%Y-%m-%d))"
            git push
          fi
