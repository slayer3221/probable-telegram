name: Refresh comments

# Pulls new or changed public comments from Regulations.gov, runs the staged
# AI classification for anything not yet processed, rebuilds data/, validates
# it and commits the result. The curated editorial/ layer is never modified.

on:
  schedule:
    # Daily at 06:17 UTC. Scheduled runs process the whole docket and commit,
    # so they only execute once the repository variable
    # REFRESH_SCHEDULE_ENABLED is set to "true" (Settings > Secrets and
    # variables > Actions > Variables). Manual runs are unaffected.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      fetch_limit:
        description: "Stop after fetching N new or changed comments (0 = whole docket)"
        default: "0"
      stage_limit:
        description: "Process at most N submissions per classification stage (0 = no limit)"
        default: "0"
      commit_results:
        description: "Commit refreshed raw/, classified/, data/ and public/ back to the branch"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: refresh-comments
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name != 'schedule' || vars.REFRESH_SCHEDULE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      REGULATIONS_GOV_API_KEY: ${{ secrets.REGULATIONS_GOV_API_KEY }}
      REGULATION_TRACKER_ANTHROPIC: ${{ secrets.REGULATION_TRACKER_ANTHROPIC }}
      # Required only for identity-linked keys. A repository variable or secret both work.
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID || vars.ANTHROPIC_WORKSPACE_ID }}
      FETCH_LIMIT: ${{ github.event.inputs.fetch_limit || '0' }}
      STAGE_LIMIT: ${{ github.event.inputs.stage_limit || '0' }}
      LLM_CONCURRENCY: ${{ vars.LLM_CONCURRENCY || '4' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check secrets are present
        run: |
          test -n "$REGULATIONS_GOV_API_KEY" || { echo "REGULATIONS_GOV_API_KEY secret is missing"; exit 1; }
          test -n "$REGULATION_TRACKER_ANTHROPIC" || { echo "REGULATION_TRACKER_ANTHROPIC secret is missing"; exit 1; }
      - name: Check model access
        run: python3 scripts/check_llm_access.py
      - name: Fetch comments and attachments
        run: python3 scripts/fetch_comments.py --limit "$FETCH_LIMIT"
      - name: Extract attachment text
        run: python3 scripts/parse_attachments.py
      - name: Segment submissions
        run: python3 scripts/segment_comments.py --limit "$STAGE_LIMIT"
      - name: Analyze positions (classification, gaps, summary in one call each)
        run: python3 scripts/analyze_positions.py --limit "$STAGE_LIMIT"
      - name: Build public data
        run: python3 scripts/build_public_data.py
      - name: Validate public data
        run: python3 scripts/validate_data.py
      - name: Run integrity tests
        run: python3 tests/test_data_integrity.py
      - name: Summarize run
        if: always()
        run: |
          echo "## Refresh summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Raw comments on disk: $(ls raw/comments/*.json 2>/dev/null | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "Usable submissions: $(grep -l '"usable": true' raw/text/*.meta.json 2>/dev/null | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f public/build-manifest.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            python3 -c "import json;m=json.load(open('public/build-manifest.json'));print(json.dumps({k:m.get(k) for k in ('counts','exclusions','model','prompt_versions')},indent=2))" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f public/run-metrics.json ]; then
            echo "### Run metrics (calls, tokens, elapsed, estimated cost)" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat public/run-metrics.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit refreshed data
        if: ${{ github.event_name == 'schedule' || github.event.inputs.commit_results == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw classified data public
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh docket data ($(date -u +%Y-%m-%d))"
            git push
          fi
